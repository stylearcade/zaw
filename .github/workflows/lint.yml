name: Lint

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Prettier
        run: npm run lint:prettier

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Lint Zig
        run: npm run lint:zig

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Lint Rust
        run: npm run lint:rust
