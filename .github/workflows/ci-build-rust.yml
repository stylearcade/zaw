name: Build Rust

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: npm ci
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: sudo apt install -y wabt
      - run: ./scripts/build-rust.sh
      - run: ./scripts/test-rust.sh

  miri:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/test-rust-miri.sh
