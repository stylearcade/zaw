name: Build Zig

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: npm ci
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: ./scripts/build-zig.sh
      - run: ./scripts/test-zig.sh
